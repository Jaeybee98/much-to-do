name: Backend Production CI/CD Pipeline

on:
  push:
    branches: [ main, feature/full-stack ]
    paths:
      - 'Server/**'
      - '.github/workflows/backend-ci-cd.yml'

jobs:
  test-and-scan:
    name: Test & Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Setup Go Development Environment
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: Server/MuchToDo/go.sum

      - name: Fetch Core Dependencies
        run: |
          cd Server/MuchToDo
          go mod download

      # Run Automated Unit Tests as requested in Phase 2
      - name: Execute Code Unit Tests
        run: |
          cd Server/MuchToDo
          go test -v ./...

  build-and-push:
    name: Docker Build & ECR Push
    needs: test-and-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      # Setup AWS Authentication parameters for security compliance
      - name: Authenticate with AWS Production Console
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Log into Amazon ECR Private Registry
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Multi-stage image creation utilizing the cloud engine
      - name: Build and Tag Production Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: muchtodo-backend
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cd Server/MuchToDo
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
