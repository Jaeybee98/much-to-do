name: "Frontend CI/CD Deployment Pipeline"

on:
  push:
    branches:
      - feature/full-stack
    paths:
      - "Client/**"

jobs:
  build-and-deploy:
    name: "Build & Sync Assets"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: Client/package.json

      - name: Install Project Dependencies
        run: |
          cd Client
          npm install

      - name: Run Package Vulnerability Scan
        run: |
          cd Client
          npm audit --audit-level=high || echo "⚠️ Non-critical vulnerabilities caught during security audit check"

      - name: Build Static Production Assets
        run: |
          cd Client
          npm run build --if-present

      - name: Configure AWS Administrative Access
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Sync Production Assets to S3
        run: bash ./scripts/deploy-frontend.sh

      - name: Invalidate CloudFront Distribution Cache
        run: |
          echo "⚡ Clearing edge location content delivery caches..."
          aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"
